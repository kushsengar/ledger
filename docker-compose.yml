version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ledger-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ledger
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ledger-network

  risk-scoring:
    build: ./risk-scoring-service
    container_name: ledger-risk-scoring
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - ledger-network

  backend:
    build: ./backend
    container_name: ledger-backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      risk-scoring:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ledger?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      RISK_SCORING_BASE_URL: http://risk-scoring:3001
    networks:
      - ledger-network

  frontend:
    build: ./frontend
    container_name: ledger-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ledger-network

volumes:
  mysql_data:

networks:
  ledger-network:
    driver: bridge
